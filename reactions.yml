# reactions.yaml
N-alkyl: >
  [#7:0][CH3:1]>>([#7H1:0].[C:1]-[*:2])

O-alkyl: >
  [#8;!$(O-C(=O)):0][CH3:1]>>([#8H1:0].[C:1]-[*:2])

amide: >
  [NX3;$(N([#6])[#6]):0]-[C:1]=[O:2]>>([N:0].[C:1](=[O:2])-O)

ester: >
  [O;$(O([#6])([#6])):0]-[C;!$([C;r5,r6](-[O;r5,r6])):1]=[O:2]>>([O:0].[C:1](=[O:2])-O)

thioester: >
  [SX2:0]-[C:1]=[O:2]>>([SX2:0].[C:1](=[O:2])-O)

ether: >
  [#6;!$(C=O);!$([CH3]);!$([C;r5,r6](-[O;r5,r6])-O):0]-[OX2H0;!r;!$(O-[C;$([C;r5,r6](-[O;r5,r6])-O)]);!$(O-[CH3]);!$(O-C(=O)):1]>>([#6:0]-O.[O:1])

glycosidic: >
  [C;$([C;r5,r6](-[O;r5,r6])-O):0]-[OX2H0;!r;!$(O-[CH3]):1]>>([C:0]-O.[O:1])

iminol: >
  [NX2H0;!R:0]=[C:1]-[O:2]>>([N:0].O[C:1]=[OX2H0:2])